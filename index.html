<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time weather with a glassmorphism design: search any city and see live conditions, forecast and weather effects.">
  <title> Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated background (colors change with temperature + day/night) -->
  <div class="bg" id="bg" aria-hidden="true">
    <span class="orb orb1"></span>
    <span class="orb orb2"></span>
    <span class="orb orb3"></span>
  </div>

  <!-- Weather effects: sun, rain, snow, wind, stars, clouds, lightning -->
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="heat-haze" id="heatHaze" aria-hidden="true"></div>
  <div class="fog-layer" id="fogLayer" aria-hidden="true"></div>
  <div class="loader" id="loader" aria-hidden="true"></div>

  <main class="app">

    <!-- ===== Top bar: brand, search, unit switch ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">⛅</span>
        <h1> Weather APP</h1>
      </div>

      <div class="search-wrap">
        <form id="searchForm" class="search glass" autocomplete="off" role="search">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </span>
          <input
            id="cityInput"
            type="text"
            placeholder="Search city… (e.g. Lahore, Paris, Tokyo)"
            aria-label="Search for a city"
            aria-autocomplete="list"
            aria-controls="suggestions"
            aria-expanded="false"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
          >
          <button type="button" id="clearBtn" class="icon-btn" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button type="button" id="locBtn" class="icon-btn" aria-label="Use my current location" title="Use my current location">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
          </button>
        </form>
        <ul id="suggestions" class="suggestions" role="listbox" aria-label="City suggestions" hidden></ul>
      </div>

      <div class="unit-toggle glass" id="unitToggle" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="c" class="active" aria-pressed="true">°C</button>
        <button type="button" data-unit="f" aria-pressed="false">°F</button>
      </div>
    </header>

    <!-- ===== Loading / error message ===== -->
    <div id="status" class="status glass" role="status" aria-live="polite" hidden></div>

    <!-- ===== Weather content ===== -->
    <section id="weather" class="weather" hidden>

      <!-- Current weather -->
      <article class="card glass hero">
        <div class="hero-top">
          <div>
            <h2 id="heroCity">—</h2>
            <p class="hero-region" id="heroRegion"></p>
            <p class="hero-date" id="heroDate"></p>
          </div>
          <span class="time-pill" id="heroTime"></span>
        </div>

        <div class="hero-main">
          <div class="temp-wrap">
            <span class="temp" id="heroTemp">--°</span><sup class="temp-unit" id="heroUnit">C</sup>
          </div>
          <div class="hero-icon-wrap">
            <img id="heroIcon" class="hero-icon" alt="" width="128" height="128">
            <span id="heroEmoji" class="hero-emoji" aria-hidden="true" hidden></span>
          </div>
        </div>

        <div class="hero-bottom">
          <p class="condition" id="heroCondition"></p>
          <div class="chips" id="heroTags"></div>
          <div class="hero-stats">
            <span>H: <strong id="heroHigh">--°</strong></span>
            <span>L: <strong id="heroLow">--°</strong></span>
            <span id="heroFeels"></span>
          </div>
        </div>
      </article>

      <!-- Detail tiles -->
      <article class="card glass details">
        <h3 class="card-title">Weather details</h3>
        <div class="tiles" id="detailsGrid"></div>
      </article>

      <!-- Hourly forecast -->
      <article class="card glass hourly">
        <h3 class="card-title">Next 24 hours</h3>
        <div class="hourly-list" id="hourlyList" tabindex="0" aria-label="Hourly forecast, scroll horizontally"></div>
      </article>

      <!-- 3-day forecast -->
      <article class="card glass daily">
        <h3 class="card-title">3-day forecast</h3>
        <div class="daily-list" id="dailyList"></div>
      </article>
    </section>

    <footer class="footer">
      <p>Weather data by <a href="https://www.weatherapi.com/" target="_blank" rel="noopener noreferrer">WeatherAPI.com</a> <span id="updated"></span></p>
    </footer>
  </main>

  <noscript><p style="position:fixed;inset:auto 0 20px 0;text-align:center;color:#fff">Please enable JavaScript to use this weather app.</p></noscript>
  <script src="script.js" defer></script>
</body>
</html>
